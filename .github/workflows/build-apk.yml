name: Build Caveman Quest APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o CavemanQuest_Android_Project.zip -d project
          find project -name settings.gradle -print

      - name: Build APK
        working-directory: project/CavemanQuestAndroid
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caveman-Quest-APK
          path: project/CavemanQuestAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
