
name: Build Caveman Quest v45

on:
  workflow_dispatch:
  push:
    paths:
      - 'CavemanQuest_v45_GLB_WEBVIEW_FIX.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v45 project
        run: |
          mkdir project
          unzip -o CavemanQuest_v45_GLB_WEBVIEW_FIX.zip -d project
          test -f project/settings.gradle
          test -f project/app/build.gradle

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Caveman-Quest-v45-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
